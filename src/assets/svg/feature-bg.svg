<svg width="100%" height="100%" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>   <!-- light blue -->
      <stop offset="100%" stop-color="#e0f2fe"/> <!-- very soft cyan -->
    </linearGradient>

    <!-- White Glass Overlay -->
    <linearGradient id="whiteOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Soft Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Blur -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="400" height="200" rx="20" fill="url(#bgGradient)" />

  <!-- White Glass Layer -->
  <rect width="400" height="200" rx="20" fill="url(#whiteOverlay)" />

  <!-- Soft Glow -->
  <circle cx="300" cy="60" r="90" fill="url(#glow)" filter="url(#blur)" />

  <!-- Very Subtle Bubbles -->
  <circle cx="70" cy="50" r="5" fill="white" opacity="0.2">
    <animate attributeName="cy" values="50;40;50" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="150" cy="160" r="6" fill="white" opacity="0.15">
    <animate attributeName="cy" values="160;145;160" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="320" cy="140" r="4" fill="white" opacity="0.2">
    <animate attributeName="cy" values="140;125;140" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Soft Bottom Wave -->
  <path d="M0 150 Q100 130 200 145 T400 140 V200 H0 Z"
        fill="white" opacity="0.15"/>
</svg>