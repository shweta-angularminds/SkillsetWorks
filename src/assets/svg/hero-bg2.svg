<svg width="100%" height="100%" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dff3ff"/>
      <stop offset="50%" stop-color="#bfe6ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="glowBlue">
      <stop offset="0%" stop-color="#6ec6ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6ec6ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Bubble gradient -->
    <radialGradient id="bubbleGrad">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Shine -->
    <radialGradient id="bubbleShine">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Blur -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)" />

  <!-- Left blob -->
  <path d="M0,0 C200,100 200,400 0,600 L0,0 Z"
        fill="#7ecbff" opacity="0.25"/>

  <!-- Glow -->
  <circle cx="880" cy="320" r="320"
          fill="url(#glowBlue)"
          filter="url(#blur)" />

  <circle cx="880" cy="320" r="260"
          fill="white"
          opacity="0.35"
          filter="url(#blur)" />

  <!-- 🔥 TOP BUBBLES -->

  <g opacity="0.7">
    <circle cx="1050" cy="120" r="70" fill="url(#bubbleGrad)" filter="url(#softBlur)" />
    <circle cx="1025" cy="95" r="20" fill="url(#bubbleShine)" />
  </g>

  <g opacity="0.6">
    <circle cx="950" cy="80" r="40" fill="url(#bubbleGrad)" filter="url(#softBlur)" />
    <circle cx="935" cy="65" r="12" fill="url(#bubbleShine)" />
  </g>

  <g opacity="0.5">
    <circle cx="780" cy="120" r="25" fill="url(#bubbleGrad)" filter="url(#softBlur)" />
    <circle cx="770" cy="110" r="8" fill="url(#bubbleShine)" />
  </g>

  <!-- 🔥 NEW BOTTOM BUBBLES -->

  <!-- Large bottom bubble -->
  <g opacity="0.5">
    <circle cx="950" cy="520" r="60" fill="url(#bubbleGrad)" filter="url(#softBlur)" />
    <circle cx="930" cy="500" r="15" fill="url(#bubbleShine)" />
  </g>

  <!-- Medium -->
  <g opacity="0.45">
    <circle cx="750" cy="540" r="40" fill="url(#bubbleGrad)" filter="url(#softBlur)" />
    <circle cx="735" cy="525" r="10" fill="url(#bubbleShine)" />
  </g>

  <!-- Small -->
  <g opacity="0.4">
    <circle cx="600" cy="510" r="25" fill="url(#bubbleGrad)" filter="url(#softBlur)" />
    <circle cx="590" cy="500" r="7" fill="url(#bubbleShine)" />
  </g>

  <!-- Extra tiny -->
  <g opacity="0.35">
    <circle cx="820" cy="560" r="18" fill="url(#bubbleGrad)" filter="url(#softBlur)" />
    <circle cx="812" cy="552" r="5" fill="url(#bubbleShine)" />
  </g>

  <!-- Bottom wave -->
  <path d="M0,500 C300,450 900,650 1200,550 L1200,600 L0,600 Z"
        fill="#ffffff"
        opacity="0.4"/>

</svg>