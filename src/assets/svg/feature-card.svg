<svg width="100%" height="100%" viewBox="0 0 400 200" 
  preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#268fff"/>
      <stop offset="100%" stop-color="#94dbff"/>
    </linearGradient>

    <!-- Glow Effect -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Blur Filter -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" rx="20" fill="url(#bgGradient)" />

  <!-- Glow Circle -->
  <circle cx="300" cy="50" r="80" fill="url(#glow)" filter="url(#blur)" />

  <!-- Floating Bubbles -->
  <circle cx="60" cy="40" r="6" fill="white" opacity="0.3">
    <animate attributeName="cy" values="40;30;40" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="120" cy="160" r="8" fill="white" opacity="0.2">
    <animate attributeName="cy" values="160;140;160" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="350" cy="150" r="5" fill="white" opacity="0.3">
    <animate attributeName="cy" values="150;130;150" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="200" cy="100" r="4" fill="white" opacity="0.2">
    <animate attributeName="cy" values="100;85;100" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Soft Wave -->
  <path d="M0 140 Q100 120 200 140 T400 140 V200 H0 Z"
        fill="white" opacity="0.1"/>
</svg>