<div class="container-fluid p-0">
  <app-navbar></app-navbar>

  <div class="container">
    <!-- 🔷 HERO SECTION -->
    <div class="row align-items-center px-2 py-4 g-3">
      <!-- LEFT IMAGE -->
      <div class="col-12 col-md-4 text-center">
        <img
          src="/assets/svg/business-goal.svg"
          alt="goal"
          class="img-fluid p-3"
        />
      </div>

      <!-- RIGHT SEARCH BOX -->
      <div
        class="col-12 col-md-8 bg-white shadow rounded-4 p-4 d-flex flex-column justify-content-center"
      >
        <div class="w-100">
          <!-- Heading -->
          <h5 class="fw-bold mb-1">Find Your Dream Job</h5>
          <p class="text-muted small mb-3">
            Search jobs by skills, location, and experience
          </p>

          <!-- Search Input -->
          <input
            type="text"
            [(ngModel)]="searchTerm"
            (ngModelChange)="onSearchChange($event)"
            class="form-control rounded-pill px-4 py-2 small mb-3"
            placeholder="Search jobs, skills, companies..."
          />

          <!-- Filters -->
          <div class="row g-2">
            <div class="col-12 col-md-4">
              <select
                class="form-select small rounded-pill"
                [(ngModel)]="filters.location"
                (change)="searchJobs()"
              >
                <option value="" disabled>Location</option>
                <option>Pune</option>
                <option>Mumbai</option>
                <option>Delhi</option>
                <option>Chennai</option>
                <option>Bangalore</option>
              </select>
            </div>

            <div class="col-12 col-md-4">
              <select
                class="form-select small rounded-pill"
                [(ngModel)]="filters.experience"
                (change)="searchJobs()"
              >
                <option value="" disabled>Experience</option>
                <option>Fresher</option>
                <option value="0-6 months">0-6 months</option>
                <option value="0-2 years">0-2 years</option>
                <option value="2-5 years">2-5 years</option>
                <option value="5-7 years">5-7 years</option>
                <option value="7-10 years">7-10 years</option>
                <option value="10-15 years">10-15 years</option>
                <option value="more than 15 years">More than 15 years</option>
              </select>
            </div>

            <div class="col-12 col-md-4">
              <select
                class="form-select small rounded-pill"
                [(ngModel)]="filters.employementType"
                (change)="searchJobs()"
              >
                <option value="" disabled>Job Type</option>
                <option>Full time</option>
                <option>Part time</option>
                <option>Internship</option>
              </select>
            </div>
            <div class="d-flex justify-content-end mt-2">
              <button
                class="btn btn-sm btn-outline-secondary rounded-pill px-3"
                (click)="clearFilters()"
              >
                Clear Filters
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 📋 JOB LIST -->
    <div class="row mt-4">
      <div class="col-lg-4 col-md-6 col-12 mb-4" *ngFor="let job of jobs">
        <div class="card h-100 shadow border job-card rounded-4">
          <div class="card-body d-flex flex-column">
            <!-- Title -->
            <h5 class="card-title fw-bold mb-1">
              {{ job.designation | titlecase }}
            </h5>

            <!-- Company -->
            <p class="text-muted mb-1 small">
              {{ job.industry }}
            </p>

            <!-- Location -->
            <p class="text-gray mb-2 small">📍 {{ job.location }}</p>

            <!-- Divider -->
            <hr class="my-2" />

            <!-- Footer -->
            <div class="mt-auto">
              <div class="d-flex flex-wrap gap-2 mb-3">
                <span class="badge bg-light text-dark small">
                  💼 {{ job.positions }} Openings
                </span>
                <span class="badge bg-light text-dark small">
                  ⏱ {{ job.updatedAt | dateDiff }}
                </span>
              </div>

              <a
                [routerLink]="['/view-job', job._id]"
                class="btn w-100 rounded-pill"
              >
                View Details
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="jobs.length === 0" class="text-center mt-5">
      <div class="p-2 text-center" *ngIf="jobs.length <= 0">
        <h5 class="fw-bold">No Job Openings right now but stay connected!</h5>
        <img
          src="assets/images/profile-cover.svg"
          class="img-fluid"
          style="min-width: 300px; border: 0; max-width: 400px"
        />
      </div>
    </div>
  </div>
</div>
