<div class="container-fluid p-0 main-container">

  <div class="d-flex flex-column flex-lg-row min-vh-100">

    <!-- Sidebar -->
    <div class="sidenav col-lg-2 col-12 p-0">
      <app-sidenavbar></app-sidenavbar>
    </div>

    <!-- Main Content -->
    <div class="col-lg-10 col-12 back-color d-flex flex-column p-0">

      <!-- Header -->
      <div class="d-flex align-items-center bg-white px-3 py-2">
        <img src="/assets/images/settings.svg" />
        <h4 class="fw-bold ms-2 mb-0">Settings</h4>
      </div>

      <!-- Content (IMPORTANT) -->
      <div class="flex-grow-1 overflow-auto px-3 py-3 scroll">

        <div class="row g-3">

          <!-- Left -->
          <div class="col-12 col-lg-4">
            <h6>Password</h6>
            <label>Update your password here</label>
          </div>

          <!-- Right -->
          <div class="col-12 col-lg-8">

            <form class="form-responsive" [formGroup]="profileForm" (ngSubmit)="onSubmit()">

              <!-- Current Password -->
              <div class="mb-3">
                <label for="password" class="form-label">Current password</label>
                <input type="password" class="form-control" id="password" formControlName="password" />
              <!-- Error Message --> <div *ngIf=" password.invalid && (password.touched || password.dirty) " class="text-danger" > <small *ngIf="password.errors?.['required']" >Current password is required.</small > </div>
              
              </div>

              <!-- New Password -->
              <div class="mb-3">
                <label for="newPassword" class="form-label">New password</label>
                <input type="password"  class="form-control" formControlName="newPassword"  id="newPassword"/>
            <div class="text-danger" *ngIf="newPassword.invalid && newPassword.touched" > <small *ngIf="newPassword.errors?.['required']" >New password is required.</small > <small *ngIf="passwordInvalid" >Password must contain at least one uppercase letter, one lowercase letter, one digit, one special character, and be at least 8 characters long.</small > </div>
            
            
              </div>

              <!-- Confirm Password -->
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm password</label>
                <input type="password" class="form-control" formControlName="confirmPassword"  id="confirmPassword"/>
              <div *ngIf="profileForm.errors?.['passwordMismatch'] && profileForm.get('confirmPassword')?.touched" class="text-danger" > <small>Passwords do not match!</small> </div>
              </div>

              <!-- Buttons -->
              <div class="d-flex justify-content-end flex-wrap gap-2 py-3">
                <button type="button" class="bg-white px-3 py-2" style="border: 1px solid #0d61fd" (click)="clearFields()">
                  Cancel
                </button>

                <button type="submit" class="text-white border-0 px-3 py-2" [disabled]="profileForm.invalid">
                  Save Changes
                </button>
              </div>

            </form>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
