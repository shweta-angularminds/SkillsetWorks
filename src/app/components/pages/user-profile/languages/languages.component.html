<div class="d-flex justify-content-between w-100">
  <div class="">
    <h5 id="list-item-1">
      <i class="fa-solid fa-language me-2 fs-5"></i>Languages
    </h5>
    <p></p>
  </div>
  <div>
    <i class="fa-solid fa-plus me-2 fs-5" (click)="openModal()"></i>
  </div>
</div>
<div
  class="mt-2 d-flex flex-wrap align-items-center justify-content-start"
  *ngIf="Languages.length; else noLanguages"
>
  <span
    *ngFor="let lang of Languages"
    style="width: 40px; height: 35px"
    class="d-flex justify-content-center align-items-center"
  >
    <div class="visible text-center">
      {{ lang }}
    </div>
    <i class="fa-solid fa-trash text-center" (click)="deleteLanguage(lang)"></i>
  </span>
</div>
<ng-template #noLanguages class="mt-2">
  <label
    >Add your known languages here to increase your job opportunities.</label
  >
</ng-template>
<div>
  <div>
    <app-modal
      [formFields]="formFields"
      [formHeader]="formTitle"
      [isVisible]="isModalVisible"
      [formData]="selectedFormData"
      (formDataChange)="handleFormDataChange($event)"
      (closeModal)="onCloseModal()"
    ></app-modal>
  </div>
</div>
